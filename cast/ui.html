<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Cast</title>
<style>
:root { --bg: #0b0e14; --card: #161b26; --line: #262e3f; --txt: #eef2f9; --dim: #8b96ab; --acc: #2f7bff; --ok: #2fc28b; --warn: #f5a524; --alert: #f0506e; }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; font: 15px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--txt); }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #7b5cff, #2f7bff); display: grid; place-items: center; font-size: 22px; }
h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 600; }
.lang { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.lang button { border: 0; background: none; color: var(--dim); padding: 6px 12px; cursor: pointer; font: inherit; }
.lang button.on { background: var(--acc); color: #fff; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.wide { grid-column: 1 / -1; }
h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 0 0 12px; font-weight: 600; }
input, select, button { font: inherit; color: inherit; }
input[type=text], select { width: 100%; background: #0f131c; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin-bottom: 8px; }
input:focus, select:focus { outline: 2px solid var(--acc); border-color: transparent; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > input, .row > select { flex: 1; min-width: 110px; margin: 0; }
button.p { background: var(--acc); border: 0; border-radius: 20px; padding: 8px 20px; cursor: pointer; font-weight: 600; color: #fff; }
button.g { background: none; border: 1px solid var(--line); border-radius: 18px; padding: 5px 12px; cursor: pointer; color: var(--dim); font-size: 13px; }
button { transition: transform .08s, background .2s, opacity .2s; }
button:active { transform: scale(.94); }
button.busy { opacity: .65; pointer-events: none; }
button.busy::after { content: ""; display: inline-block; width: 10px; height: 10px; margin-left: 8px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -1px; }
button.done { background: var(--ok) !important; border-color: var(--ok) !important; color: #fff !important; }
button.fail { background: var(--alert) !important; border-color: var(--alert) !important; color: #fff !important; }
@keyframes sp { to { transform: rotate(360deg); } }
.msg { min-height: 20px; margin-top: 8px; font-size: 13px; color: var(--dim); } .ok { color: var(--ok); } .err { color: var(--alert); }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 9px 0; border-bottom: 1px solid var(--line); }
li:last-child { border: 0; }
li .who { flex: 1; min-width: 160px; } li small { color: var(--dim); display: block; }
.tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; background: #232a38; color: var(--dim); }
.tag.good { color: var(--ok); } .tag.bad { color: var(--warn); }
.empty { color: var(--dim); text-align: center; padding: 14px 0; }
.dur { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 13px; margin: 6px 0 10px; }
.dur input { flex: 1; accent-color: var(--acc); } .dur b { color: var(--txt); min-width: 44px; text-align: right; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="head">
  <div class="logo">&#128225;</div>
  <h1 data-t="title">Cast</h1>
  <div class="lang"><button type="button" id="l-en">EN</button><button type="button" id="l-pt">PT</button></div>
</div>
<div class="grid">
  <div class="card">
    <h2 data-t="send">Send to TVs</h2>
    <input type="text" id="title" maxlength="40" data-p="ph_title">
    <input type="text" id="message" maxlength="200" data-p="ph_msg">
    <div class="row" style="margin-bottom:8px">
      <select id="level"><option value="info">Info</option><option value="ok">OK</option><option value="warn">Warning</option><option value="alert">Alert</option></select>
      <select id="mode"><option value="banner" data-t="m_banner">Samsung banner</option><option value="full" data-t="m_full">Full screen</option><option value="both" data-t="m_both">Both</option></select>
    </div>
    <div class="dur"><span data-t="secs">Show for (s)</span><input type="range" id="secs" min="1" max="60" value="8"><b id="secsv">8 s</b></div>
    <select id="target"></select>
    <div class="row"><button type="button" class="p" id="cast" data-t="cast">Cast</button></div>
    <div class="msg" id="result"></div>
    <ul id="results"></ul>
  </div>
  <div class="card">
    <h2 data-t="tvs">My TVs</h2>
    <ul id="tvlist"></ul>
    <div class="row" style="margin-top:10px"><input type="text" id="n-name" data-p="ph_name"><input type="text" id="n-host" data-p="ph_host"><input type="text" id="n-group" data-p="ph_group" style="max-width:110px"><button type="button" class="g" id="add" data-t="add">Add</button></div>
    <div class="msg" id="tvmsg"></div>
  </div>
  <div class="card wide">
    <h2 data-t="find">Find Samsung TVs on the network</h2>
    <div class="row"><button type="button" class="g" id="scan" data-t="scan">Find TVs</button><span class="msg" style="margin:0" data-t="scannote">Scans your home network once, only when you press the button (10-20 s).</span></div>
    <ul id="found"></ul>
    <div class="msg" id="scanmsg"></div>
  </div>
  <div class="card wide">
    <h2 data-t="recent">Activity</h2>
    <ul id="log"></ul>
  </div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var T = {
    en: { title: "Cast", send: "Send to TVs", cast: "Cast", secs: "Show for (s)", tvs: "My TVs", add: "Add", find: "Find Samsung TVs on the network", scan: "Find TVs",
      scannote: "Scans your home network once, only when you press the button (10-20 s).", recent: "Activity", ph_title: "Title (optional)", ph_msg: "Message", ph_name: "Name", ph_host: "Address (192.168.x.x)", ph_group: "Group",
      m_banner: "Samsung banner", m_full: "Full screen", m_both: "Both", all: "All my TVs", group: "Group: ", none: "No TVs yet. Add one or press Find TVs.", test: "Test", remove: "Remove", pair: "Pair",
      confirm: "Confirm", code: "6-digit code on the TV", paired: "paired", unpaired: "no key", ready: "Notification Center ready", noapp: "no Notification Center yet", self: "this TV",
      sent: "Delivered", failed: "Failed", saved: "Saved.", scanning: "Scanning...", nofound: "No Samsung TV found.", noactivity: "Nothing yet.", needmsg: "Write a message first.",
      pairasked: "Look at that TV: it shows a 6-digit code. Type it below.", added: "Added.", retry: "will retry", needapp: "Needs the Notification Center app and Shard on that TV to show banners." },
    pt: { title: "Cast", send: "Enviar para as TVs", cast: "Enviar", secs: "Mostrar durante (s)", tvs: "As minhas TVs", add: "Adicionar", find: "Procurar TVs Samsung na rede", scan: "Procurar TVs",
      scannote: "Percorre a rede de casa uma vez, s\u00F3 quando carregas no bot\u00E3o (10-20 s).", recent: "Atividade", ph_title: "T\u00EDtulo (opcional)", ph_msg: "Mensagem", ph_name: "Nome", ph_host: "Endere\u00E7o (192.168.x.x)", ph_group: "Grupo",
      m_banner: "Aviso Samsung", m_full: "Ecr\u00E3 inteiro", m_both: "Ambos", all: "Todas as minhas TVs", group: "Grupo: ", none: "Ainda sem TVs. Adiciona uma ou carrega em Procurar TVs.", test: "Teste", remove: "Remover", pair: "Emparelhar",
      confirm: "Confirmar", code: "C\u00F3digo de 6 d\u00EDgitos na TV", paired: "emparelhada", unpaired: "sem chave", ready: "Notification Center pronto", noapp: "ainda sem Notification Center", self: "esta TV",
      sent: "Entregue", failed: "Falhou", saved: "Guardado.", scanning: "A procurar...", nofound: "Nenhuma TV Samsung encontrada.", noactivity: "Ainda nada.", needmsg: "Escreve primeiro uma mensagem.",
      pairasked: "V\u00EA essa TV: mostra um c\u00F3digo de 6 d\u00EDgitos. Escreve-o abaixo.", added: "Adicionada.", retry: "vai tentar de novo", needapp: "Precisa da app e do Shard Notification Center nessa TV para mostrar avisos." }
  };
  var lang = "en", state = { tvs: [], log: [] }, pairing = {};
  function tr(k) { return T[lang][k] || T.en[k] || k; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function say(id, t, cls) { $(id).textContent = t || ""; $(id).className = "msg " + (cls || ""); }
  function api(path, body) {
    var opt = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
    return fetch(path, opt).then(function (r) { return r.json().then(function (j) { if (!r.ok) { throw new Error(j.error || "error " + r.status); } return j; }); });
  }
  // Visible feedback on action buttons: spinner while it runs (at least 0.45 s), then green (done) or red (failed).
  function act(btn, p, msgId) {
    var t0 = Date.now();
    btn.classList.add("busy");
    function end(cls) { setTimeout(function () { btn.classList.remove("busy"); btn.classList.add(cls); setTimeout(function () { btn.classList.remove(cls); }, 1300); }, Math.max(0, 450 - (Date.now() - t0))); }
    p.then(function () { end("done"); }, function (e) { say(msgId || "result", e.message, "err"); end("fail"); });
  }
  function applyText() {
    document.documentElement.lang = lang;
    var els = document.querySelectorAll("[data-t]"), i;
    for (i = 0; i < els.length; i++) { els[i].textContent = tr(els[i].getAttribute("data-t")); }
    els = document.querySelectorAll("[data-p]");
    for (i = 0; i < els.length; i++) { els[i].placeholder = tr(els[i].getAttribute("data-p")); }
    $("l-en").className = lang === "en" ? "on" : ""; $("l-pt").className = lang === "pt" ? "on" : "";
  }
  function bindAll(sel, fn) { var els = document.querySelectorAll(sel), i; for (i = 0; i < els.length; i++) { els[i].addEventListener("click", fn); } }
  function renderTvs() {
    var groups = {}, opts = '<option value="">' + esc(tr("all")) + "</option>";
    state.tvs.forEach(function (t) { if (t.group) { groups[t.group] = 1; } });
    Object.keys(groups).forEach(function (g) { opts += '<option value="g:' + esc(g) + '">' + esc(tr("group") + g) + "</option>"; });
    state.tvs.forEach(function (t) { opts += '<option value="t:' + esc(t.id) + '">' + esc(t.name) + "</option>"; });
    var keep = $("target").value; $("target").innerHTML = opts; $("target").value = keep || "";
    $("tvlist").innerHTML = state.tvs.length ? state.tvs.map(function (t) {
      var p = pairing[t.id];
      return '<li><div class="who"><b>' + esc(t.name) + "</b><small>" + esc(t.host) + (t.group ? " \u00B7 " + esc(t.group) : "") + '</small></div><span class="tag ' + (t.paired ? "good" : "") + '">' + esc(t.paired ? tr("paired") : tr("unpaired")) + "</span>" +
        '<button type="button" class="g" data-test="' + esc(t.id) + '">' + esc(tr("test")) + '</button><button type="button" class="g" data-pair="' + esc(t.id) + '">' + esc(tr("pair")) + '</button><button type="button" class="g" data-del="' + esc(t.id) + '">' + esc(tr("remove")) + "</button>" +
        (p ? '<div class="row" style="width:100%"><input type="text" maxlength="6" data-code="' + esc(t.id) + '" placeholder="' + esc(tr("code")) + '"><button type="button" class="p" data-confirm="' + esc(t.id) + '">' + esc(tr("confirm")) + "</button></div>" : "") + "</li>";
    }).join("") : '<li class="empty">' + esc(tr("none")) + "</li>";
    bindAll("[data-test]", function () { var id = this.getAttribute("data-test"); act(this, api("test", { id: id }).then(function (r) { say("tvmsg", r.results[0].ok ? tr("sent") : tr("failed") + ": " + r.results[0].error, r.results[0].ok ? "ok" : "err"); refresh(); }), "tvmsg"); });
    bindAll("[data-del]", function () { act(this, api("tv", { action: "delete", id: this.getAttribute("data-del") }).then(function (d) { state.tvs = d.tvs; renderTvs(); }), "tvmsg"); });
    bindAll("[data-pair]", function () { var id = this.getAttribute("data-pair"); act(this, api("pair", { id: id }).then(function (d) { pairing[id] = d.pairId; say("tvmsg", tr("pairasked"), "ok"); renderTvs(); }), "tvmsg"); });
    bindAll("[data-confirm]", function () {
      var id = this.getAttribute("data-confirm"), code = document.querySelector('[data-code="' + id + '"]').value;
      act(this, api("confirm", { id: id, pairId: pairing[id], code: code }).then(function () { delete pairing[id]; say("tvmsg", tr("saved"), "ok"); refresh(); }), "tvmsg");
    });
  }
  function renderLog() { $("log").innerHTML = state.log.length ? state.log.map(function (e) { return "<li><div class=\"who\">" + esc(e.text) + "<small>" + new Date(e.at).toLocaleTimeString() + "</small></div></li>"; }).join("") : '<li class="empty">' + esc(tr("noactivity")) + "</li>"; }
  function refresh() { return api("state").then(function (d) { state = d; renderTvs(); renderLog(); }).catch(function (e) { say("result", e.message, "err"); }); }
  function addTv(name, host, group) { return api("tv", { action: "add", name: name, host: host, group: group }).then(function (d) { state.tvs = d.tvs; renderTvs(); say("tvmsg", tr("added"), "ok"); }); }
  $("add").addEventListener("click", function () { act(this, addTv($("n-name").value, $("n-host").value, $("n-group").value).then(function () { $("n-name").value = ""; $("n-host").value = ""; }), "tvmsg"); });
  $("secs").addEventListener("input", function () { $("secsv").textContent = this.value + " s"; });
  $("cast").addEventListener("click", function () {
    if (!$("message").value.trim()) { say("result", tr("needmsg"), "err"); return; }
    var t = $("target").value, body = { title: $("title").value, message: $("message").value, level: $("level").value, mode: $("mode").value, duration: parseInt($("secs").value, 10) };
    if (t.indexOf("g:") === 0) { body.group = t.slice(2); } else if (t.indexOf("t:") === 0) { body.tvIds = [t.slice(2)]; }
    say("result", "");
    act(this, api("cast", body).then(function (r) {
      $("results").innerHTML = r.results.map(function (x) { return "<li><div class=\"who\"><b>" + esc(x.name) + "</b></div><span class=\"tag " + (x.ok ? "good" : "bad") + "\">" + esc(x.ok ? tr("sent") : tr("failed") + (x.error ? ": " + x.error : "") + " (" + tr("retry") + ")") + "</span></li>"; }).join("");
      $("message").value = ""; refresh();
    }), "result");
  });
  $("scan").addEventListener("click", function () {
    say("scanmsg", tr("scanning"));
    act(this, api("scan", {}).then(function (d) {
      say("scanmsg", d.found.length ? "" : tr("nofound"), d.found.length ? "" : "err");
      $("found").innerHTML = d.found.map(function (f, i) {
        var have = state.tvs.some(function (t) { return t.host === f.host; });
        return '<li><div class="who"><b>' + esc(f.name) + "</b> " + (f.self ? '<span class="tag">' + esc(tr("self")) + "</span>" : "") + "<small>" + esc(f.host) + (f.model ? " \u00B7 " + esc(f.model) : "") + "</small></div>" +
          '<span class="tag ' + (f.notify ? "good" : "bad") + '">' + esc(f.notify ? tr("ready") : tr("noapp")) + "</span>" + (have ? "" : '<button type="button" class="g" data-addf="' + i + '">' + esc(tr("add")) + "</button>") + (f.notify ? "" : '<div class="msg" style="width:100%;margin:0">' + esc(tr("needapp")) + "</div>") + "</li>";
      }).join("");
      bindAll("[data-addf]", function () { var f = d.found[parseInt(this.getAttribute("data-addf"), 10)], b = this; act(b, addTv(f.name, f.host, "").then(function () { b.hidden = true; }), "scanmsg"); });
    }), "scanmsg");
  });
  function setLang(l) { lang = l; applyText(); renderTvs(); renderLog(); api("lang", { lang: l }).catch(function () { /* keep UI language */ }); }
  $("l-en").addEventListener("click", function () { setLang("en"); });
  $("l-pt").addEventListener("click", function () { setLang("pt"); });
  applyText();
  refresh().then(function () { if (state.lang && state.lang !== lang) { lang = state.lang; applyText(); renderTvs(); renderLog(); } });
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
